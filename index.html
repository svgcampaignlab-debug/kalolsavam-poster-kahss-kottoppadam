<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>തക്ഷജം സ്കൂൾ കലോത്സവം 2026</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Anek+Malayalam:wght@600;700;800&family=Montserrat:wght@700;800;900&display=swap');
  :root{ --mag:#c2185b; --blue:#154a9a; --ink:#3b1d12; }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; color:var(--ink);
    font-family:'Anek Malayalam',system-ui,sans-serif;
    background:
      radial-gradient(circle at 8% 0%, rgba(255,80,120,.16), transparent 40%),
      radial-gradient(circle at 96% 8%, rgba(80,40,20,.08), transparent 42%),
      #f7ead0;
    display:flex; flex-direction:column; align-items:center;
    padding:20px 14px 56px;
  }
  .bar{ width:100%; max-width:440px; height:6px; border-radius:4px; margin-bottom:12px;
    background:linear-gradient(90deg,#e53935,#1e88e5 40%,#43a047); }
  h1{ font-size:18px; font-weight:800; text-align:center; margin:0 0 4px; color:#7a1030; }
  p.sub{ text-align:center; color:#7a5a40; margin:0 0 14px; font-size:13px; }
  .stage{ width:100%; max-width:440px; border-radius:16px; overflow:hidden;
    box-shadow:0 16px 36px rgba(80,20,20,.18); background:#4a1020; }
  .stage canvas{ display:block; width:100%; height:auto; }
  .cards{ width:100%; max-width:440px; margin-top:16px; display:flex; flex-direction:column; gap:12px; }
  .card{ background:#fffdf8; border-radius:16px; padding:14px 16px; border:1px solid #ead7b8;
    box-shadow:0 8px 18px rgba(80,30,10,.07); position:relative; overflow:hidden; }
  .card::before{ content:""; position:absolute; left:0; top:0; bottom:0; width:4px;
    background:linear-gradient(180deg,#e53935,#1e88e5); }
  .card-head{ display:flex; align-items:center; gap:8px; margin-bottom:10px; }
  .num{ width:24px; height:24px; border-radius:50%; background:linear-gradient(135deg,#e53935,#8e24aa);
    color:#fff; font-size:12px; font-weight:800; display:flex; align-items:center; justify-content:center;
    font-family:'Montserrat',sans-serif; flex-shrink:0; }
  .ttl{ font-size:14.5px; font-weight:800; color:#7a1030; }
  label{ display:block; font-size:12px; color:#7a5a40; font-weight:700; margin-bottom:6px; }
  input[type="text"], select{
    width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid #e6d0ae; background:#fffaf1;
    font-family:'Anek Malayalam','Montserrat',sans-serif; font-weight:700; font-size:16px; outline:none; color:#3b1d12;
  }
  select{ font-family:'Montserrat','Anek Malayalam',sans-serif; font-size:14px; }
  input:focus, select:focus{ border-color:#c2185b; }
  .fs-row{ display:flex; align-items:center; gap:8px; margin-top:8px; }
  .fs-lab{ margin:0 !important; font-size:11.5px; white-space:nowrap; }
  .fs-row input[type="number"]{ width:68px; padding:7px; border-radius:8px; border:1.5px solid #e6d0ae;
    font-family:'Montserrat',sans-serif; font-weight:800; text-align:center; }
  .fs-row input[type="range"]{ flex:1; accent-color:#c2185b; }
  .btn{ width:100%; padding:12px; border:none; border-radius:10px; font-weight:800; cursor:pointer;
    font-family:'Anek Malayalam',sans-serif; }
  .btn-photo{ background:linear-gradient(135deg,#e53935,#8e24aa); color:#fff; }
  .btn-recrop{ background:#fde8ef; color:#7a1030; border:1.5px solid #f3c0d0; margin-top:8px; }
  .btn-reset{ background:#fff; color:#8a3a3a; border:1.5px solid #f0c7c7; margin-top:8px; }
  .btn-recrop:disabled,.btn-reset:disabled{ opacity:.4; cursor:not-allowed; }
  .photo-row{ display:flex; gap:10px; align-items:center; }
  .thumb{ width:64px; height:76px; border-radius:12px; border:2px dashed #e0c49a; overflow:hidden;
    display:flex; align-items:center; justify-content:center; background:#fff6e8; flex-shrink:0; }
  .thumb img{ width:100%; height:100%; object-fit:cover; }
  .hint{ font-size:11.5px; color:#8a6a4a; margin-top:8px; line-height:1.45; }
  .btn-download{ background:linear-gradient(135deg,#7a1030,#3b0a18); color:#fff; font-size:15.5px; padding:15px; }
  #filePhoto{ display:none; }
  .modal-backdrop{ position:fixed; inset:0; background:rgba(40,10,20,.84); display:none; align-items:center; justify-content:center; z-index:50; padding:20px; }
  .modal-backdrop.open{ display:flex; }
  .modal-card{ background:#fff; border-radius:18px; padding:20px; width:100%; max-width:360px; text-align:center; }
  .modal-card h2{ margin:0 0 6px; color:#7a1030; font-size:16px; }
  .crop-wrap{ margin:0 auto 12px; border-radius:16px; overflow:hidden; background:#f3e7d6; touch-action:none; cursor:grab; }
  .crop-wrap canvas{ display:block; }
  .zoom-row{ display:flex; align-items:center; gap:10px; margin-bottom:14px; }
  .zoom-row input{ flex:1; accent-color:#c2185b; }
  .modal-actions{ display:flex; gap:10px; }
  .btn-cancel{ background:#f4eee6; color:#4d5d73; }
</style>
</head>
<body>
  <div class="bar"></div>
  <h1>തക്ഷജം സ്കൂൾ കലോത്സവം 2026</h1>
  <p class="sub">ഫോട്ടോയും വിവരങ്ങളും ചേർത്ത് അഭിനന്ദന പോസ്റ്റർ തയ്യാറാക്കൂ</p>
  <div class="stage"><canvas id="posterCanvas" width="1366" height="2048"></canvas></div>

  <div class="cards">
    <div class="card">
      <div class="card-head"><span class="num">1</span><span class="ttl">ഇനം (Item)</span></div>
      <label for="itemInput">ഇനത്തിന്റെ പേര്</label>
      <input type="text" id="itemInput" maxlength="24" placeholder="ഉദാ: മാപ്പിളപ്പാട്ട്" autocomplete="off">
      <div class="fs-row">
        <label class="fs-lab">ഫോണ്ട് സൈസ്</label>
        <input type="range" id="itemSizeRange" min="28" max="150" value="78">
        <input type="number" id="itemSize" min="28" max="150" value="78">
      </div>
    </div>

    <div class="card">
      <div class="card-head"><span class="num">2</span><span class="ttl">ഫോട്ടോ</span></div>
      <div class="photo-row">
        <div class="thumb" id="photoThumb">📷</div>
        <div style="flex:1">
          <button class="btn btn-photo" id="pickPhotoBtn">ഫോട്ടോ അപ്‌ലോഡ് ചെയ്യുക</button>
          <button class="btn btn-recrop" id="recropPhotoBtn" disabled>✂️ ക്രോപ്പ് ക്രമീകരിക്കുക</button>
          <button class="btn btn-reset" id="resetPhotoBtn" disabled>↺ റീസെറ്റ്</button>
        </div>
      </div>
      <p class="hint">മോഡലിലെ അതേ റൗണ്ടഡ് ഫ്രെയിമിൽ നാല് വശവും നിറയും.</p>
    </div>

    <div class="card">
      <div class="card-head"><span class="num">3</span><span class="ttl">പേര്</span></div>
      <label for="nameInput">കുട്ടിയുടെ പേര്</label>
      <input type="text" id="nameInput" maxlength="22" placeholder="ഉദാ: അനന്യ കുമാർ" autocomplete="off">
    </div>

    <div class="card">
      <div class="card-head"><span class="num">4</span><span class="ttl">Place / Grade</span></div>
      <label for="placeInput">സ്ഥാനം തിരഞ്ഞെടുക്കുക</label>
      <select id="placeInput">
        <option value="">— Select Place / Grade —</option>
        <option>FIRST WITH A GRADE</option>
        <option>SECOND WITH A GRADE</option>
        <option>THIRD WITH A GRADE</option>
        <option>A GRADE</option>
        <option>B GRADE</option>
        <option>C GRADE</option>
      </select>
    </div>

    <button class="btn btn-download" id="downloadBtn">⬇ പോസ്റ്റർ ഡൗൺലോഡ് ചെയ്യുക</button>
    <input type="file" id="filePhoto" accept="image/*">
  </div>

  <div class="modal-backdrop" id="cropModal">
    <div class="modal-card">
      <h2>ഫോട്ടോ ക്രോപ്പ് ചെയ്യുക</h2>
      <p style="color:#7a5a40;font-size:12px;margin:0 0 12px">വലിച്ചു നീക്കാം, സൂം ചെയ്യാം.</p>
      <div class="crop-wrap" id="cropWrap"><canvas id="cropCanvas"></canvas></div>
      <div class="zoom-row"><span>➖</span><input type="range" id="zoomRange" min="100" max="350" value="100"><span>➕</span></div>
      <div class="modal-actions">
        <button class="btn btn-cancel" id="cropCancelBtn">റദ്ദാക്കുക</button>
        <button class="btn btn-photo" id="cropConfirmBtn">✔ ശരി</button>
      </div>
    </div>
  </div>

  const PHOTO = { cx: 190*S, cy: 430*S, w: 210*S, h: 240*S, radius: 16*S };
  const ITEM  = { x: 341*S, y: 278*S, maxW: 600*S };
  const NAME  = { x: 318*S, y: 432*S, maxW: 340*S, size: 110 };
  const PLACE = { x: 318*S, y: 500*S, maxW: 340*S, size: 90 };

  let photoPlacement = null;

  function roundRectPath(c,x,y,w,h,r){
    const rr=Math.min(r,w/2,h/2);
    c.beginPath(); c.moveTo(x+rr,y);
    c.arcTo(x+w,y,x+w,y+h,rr); c.arcTo(x+w,y+h,x,y+h,rr);
    c.arcTo(x,y+h,x,y,rr); c.arcTo(x,y,x+w,y,rr); c.closePath();
  }
  function fitText(c, text, maxW, start, family, weight){
    let s = start;
    c.font = (weight||'800')+' '+s+'px '+family;
    while(c.measureText(text).width > maxW && s > 18){
      s -= 1; c.font = (weight||'800')+' '+s+'px '+family;
    }
    return s;
  }
  function val(id, fb){ const n=+document.getElementById(id).value; return isNaN(n)?fb:n; }

  function draw(){
    ctx.clearRect(0,0,CW,CH);

      ctx.drawImage(templateImg, 0, 0, CW, CH);

    const item = document.getElementById('itemInput').value.trim();

      ctx.fillStyle = '#d5005a';
      ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      fitText(ctx, item, ITEM.maxW, val('itemSize',78), '"Anek Malayalam","Noto Sans Malayalam",sans-serif', '800');

      ctx.restore();
    }

    ctx.save();

    ctx.shadowBlur = 16; ctx.shadowOffsetY = 6;

    ctx.fill();
    ctx.restore();

    if(photoPlacement){
      ctx.save();
      roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);
      ctx.clip();
      ctx.drawImage(photoPlacement.img, PHOTO.cx+photoPlacement.x, PHOTO.cy+photoPlacement.y, photoPlacement.w, photoPlacement.h);
      ctx.restore();
    }
    ctx.save();
    roundRectPath(ctx, PHOTO.cx-PHOTO.w/2, PHOTO.cy-PHOTO.h/2, PHOTO.w, PHOTO.h, PHOTO.radius);

    ctx.strokeStyle = '#3b1a12';
    ctx.stroke();
    ctx.restore();

    const name = document.getElementById('nameInput').value.trim();

      ctx.fillStyle = '#c2185b';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';

      ctx.fillText(name, NAME.x, NAME.y);
      ctx.restore();
    }

      ctx.save();
      ctx.fillStyle = '#154a9a';
      ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
      fitText(ctx, place, PLACE.maxW, PLACE.size, '"Montserrat","Poppins",sans-serif', '800');
      ctx.fillText(place, PLACE.x, PLACE.y);
      ctx.restore();
    }
  }

  templateImg.onload = () => {
    if(document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
    draw();
  };

  ['itemInput','nameInput'].forEach(id => {
    document.getElementById(id).addEventListener('input', draw);
  });
  document.getElementById('placeInput').addEventListener('change', draw);

  function bindSize(id){
    const num=document.getElementById(id), range=document.getElementById(id+'Range');
    function sync(from){
      let v=parseInt(from.value,10); if(isNaN(v)) return;
      v=Math.max(+num.min, Math.min(+num.max, v));
      num.value=v; range.value=v; draw();
    }
    num.addEventListener('input', ()=>sync(num));
    range.addEventListener('input', ()=>sync(range));
  }
  bindSize('itemSize');

  const cropModal=document.getElementById('cropModal');
  const cropCanvas=document.getElementById('cropCanvas');
  const cropCtx=cropCanvas.getContext('2d');
  const cropWrap=document.getElementById('cropWrap');
  const zoomRange=document.getElementById('zoomRange');
  let pendingImg=null, baseScale=1, zoom=1, panX=0, panY=0;
  let dragging=false, dsx=0, dsy=0, psx=0, psy=0;
  let PW=260, PH=300;

  function cur(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    return {x:PW/2-w/2+panX, y:PH/2-h/2+panY, w, h};
  }
  function clamp(){
    const sc=baseScale*zoom, w=pendingImg.width*sc, h=pendingImg.height*sc;
    const mx=Math.max(0,(w-PW)/2), my=Math.max(0,(h-PH)/2);
    panX=Math.min(mx,Math.max(-mx,panX)); panY=Math.min(my,Math.max(-my,panY));
  }
  function drawCrop(){
    cropCtx.clearRect(0,0,PW,PH);
    cropCtx.save();
    roundRectPath(cropCtx,0,0,PW,PH, PHOTO.radius*(PW/PHOTO.w));
    cropCtx.clip(); cropCtx.fillStyle='#f3e7d6'; cropCtx.fillRect(0,0,PW,PH);
    if(pendingImg){ const d=cur(); cropCtx.drawImage(pendingImg,d.x,d.y,d.w,d.h); }
    cropCtx.restore();
    cropCtx.save();
    roundRectPath(cropCtx,4,4,PW-8,PH-8, PHOTO.radius*(PW/PHOTO.w));
    cropCtx.lineWidth=8; cropCtx.strokeStyle='#3b1a12'; cropCtx.stroke();
    cropCtx.restore();
  }
  function openCrop(img){
    pendingImg=img;
    PW=260; PH=Math.round(260*(PHOTO.h/PHOTO.w));
    cropCanvas.width=PW; cropCanvas.height=PH;
    cropWrap.style.width=PW+'px'; cropWrap.style.height=PH+'px';
    baseScale=Math.max(PW/img.width, PH/img.height);
    zoom=1; panX=0; panY=0; zoomRange.value=100;
    drawCrop(); cropModal.classList.add('open');
  }
  cropWrap.addEventListener('pointerdown', e => {
    if(!pendingImg) return;
    dragging=true; cropWrap.setPointerCapture(e.pointerId);
    dsx=e.clientX; dsy=e.clientY; psx=panX; psy=panY;
  });
  cropWrap.addEventListener('pointermove', e => {
    if(!dragging) return;
    panX=psx+(e.clientX-dsx); panY=psy+(e.clientY-dsy); clamp(); drawCrop();
  });
  cropWrap.addEventListener('pointerup', ()=>dragging=false);
  cropWrap.addEventListener('pointercancel', ()=>dragging=false);
  zoomRange.addEventListener('input', ()=>{ zoom=parseInt(zoomRange.value,10)/100; clamp(); drawCrop(); });
  document.getElementById('cropCancelBtn').onclick=()=>cropModal.classList.remove('open');
  document.getElementById('cropConfirmBtn').onclick=()=>{
    const d=cur(); const mapX=PHOTO.w/PW, mapY=PHOTO.h/PH;
    photoPlacement={ img:pendingImg, x:(d.x-PW/2)*mapX, y:(d.y-PH/2)*mapY, w:d.w*mapX, h:d.h*mapY };
    document.getElementById('recropPhotoBtn').disabled=false;
    document.getElementById('resetPhotoBtn').disabled=false;
    const thumb=document.getElementById('photoThumb'); thumb.innerHTML='';
    const im=document.createElement('img'); im.src=pendingImg.src; thumb.appendChild(im);
    cropModal.classList.remove('open'); draw();
  };

  const filePhoto=document.getElementById('filePhoto');
  document.getElementById('pickPhotoBtn').onclick=()=>filePhoto.click();
  filePhoto.addEventListener('change', e=>{
    const file=e.target.files&&e.target.files[0]; if(!file) return;
    const r=new FileReader();
    r.onload=ev=>{ const img=new Image(); img.onload=()=>openCrop(img); img.src=ev.target.result; };
    r.readAsDataURL(file); filePhoto.value='';
  });
  document.getElementById('recropPhotoBtn').onclick=()=>{ if(photoPlacement) openCrop(photoPlacement.img); };
  document.getElementById('resetPhotoBtn').onclick=()=>{
    photoPlacement=null; document.getElementById('photoThumb').innerHTML='📷';
    document.getElementById('recropPhotoBtn').disabled=true;
    document.getElementById('resetPhotoBtn').disabled=true; draw();
  };

  document.getElementById('downloadBtn').onclick=()=>{
    draw();
    const nm=(document.getElementById('nameInput').value.trim()||'poster').replace(/\s+/g,'_');
    canvas.toBlob(blob=>{
      if(!blob) return;
      const url=URL.createObjectURL(blob);
      const a=document.createElement('a'); a.href=url; a.download='takshajam-'+nm+'.jpg';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),60000);
    },'image/jpeg',0.92);
  };
})();
</script>
</body>
</html>
